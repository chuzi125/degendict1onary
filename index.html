<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Degen Dictionary — A field guide to crypto slang</title>
<meta name="description" content="A searchable field guide to crypto and Web3 slang, concepts, memes and culture.">
<meta property="og:site_name" content="Degen Dictionary">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0b'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='700' fill='%2322c55e' text-anchor='middle'%3Ed%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a href="#main" class="sr">Skip to content</a>
<header class="top">
  <div class="wrap">
    <a class="mark" href="#/" aria-label="Degen Dictionary home">degen<i>.</i>dictionary</a>
    <nav class="main" aria-label="Primary">
      <a href="#/" data-nav="home">Dictionary</a>
      <a href="#/about" data-nav="about">About</a>
    </nav>
    <div class="sp"></div>
    <button class="hbtn" id="openSearch" aria-label="Search the dictionary">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Search</span><kbd>⌘K</kbd>
    </button>
    <button class="hbtn" id="termToggle" aria-pressed="false" aria-label="Terminal mode">
      <svg viewBox="0 0 24 24"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></svg><span class="lbl">Terminal mode</span>
    </button>
  </div>
</header>

<main id="main"></main>

<footer class="foot"><div class="wrap"><span>degen dictionary · not financial advice · degen score is a joke, not a metric</span><span id="count"></span></div></footer>

<!-- search palette -->
<div class="ov" id="pal" role="dialog" aria-modal="true" aria-label="Search dictionary">
  <div class="pal">
    <div class="in">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="palIn" type="text" role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list" placeholder="Search terms, aliases, definitions…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <kbd>ESC</kbd>
    </div>
    <ul id="palList" role="listbox" aria-label="Results"></ul>
    <div class="foot"><span>↑↓ navigate</span><span>↵ open</span><span>esc close</span></div>
  </div>
</div>

<!-- share studio -->
<div class="ov st" id="studioOv" role="dialog" aria-modal="true" aria-labelledby="studioTitle">
  <div class="studio">
    <header><span class="cap" id="studioTitle">SHARE THIS DEGEN</span><button class="hbtn" id="studioClose" aria-label="Close share studio"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
    <div class="sb">
      <div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Share card preview"></canvas><span class="ld">RENDERING…</span></div>
      <div class="ctl">
        <div><span class="cap">Template</span><div class="opts" id="tplOpts"></div></div>
        <div><span class="cap">Format</span><div class="opts" id="fmtOpts"></div></div>
        <div class="stack" id="shareActs"></div>
        <div class="status" id="shStatus" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<noscript>Degen Dictionary needs JavaScript.</noscript>
</body>
</html>
